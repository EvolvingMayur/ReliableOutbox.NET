services:
  postgres:
    image: postgres:18-alpine
    container_name: reliable-outbox-postgres
    environment:
      POSTGRES_DB: reliable_outbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - reliable-outbox-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reliable_outbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reliable-outbox-data:
